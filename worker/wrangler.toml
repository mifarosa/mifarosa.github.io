# Admin backend for mifarosa.com: GitHub sign-in and the GoatCounter stats proxy.
# Deployed by Cloudflare Workers Builds (root directory: worker) on every push to main.
# Secrets (GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GOATCOUNTER_KEY) are set in the Cloudflare dashboard.
# The name must match the Worker in the dashboard.
name = "fancy-wildflower-a41a"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_USER = "mifarosa"
# Sites that may use the sign-in popup (hostnames)
ALLOWED_DOMAINS = "mifarosa.com,localhost"
# Pages that may call /stats (origins)
ALLOWED_ORIGINS = "https://mifarosa.com,http://localhost:4321"
GOATCOUNTER_CODE = "mifarosa"
